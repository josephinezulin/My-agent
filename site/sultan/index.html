<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蘇丹的遊戲</title>
<meta name="description" content="蘇丹的遊戲 網頁版：把人物、金幣與物品放進儀式，七天內完成蘇丹的旨意。">
<style>
  :root {
    --desk1: #2b1712;
    --desk2: #1a0d0a;
    --felt: #3a1d16;
    --line: #6b4a2f;
    --gold: #d9b26a;
    --gold2: #f3dca0;
    --ink: #2a1a10;
    --paper1: #f1e3c4;
    --paper2: #d9c39a;
    --text: #f1e6d2;
    --muted: #b8a284;
    --red: #e0574a;
    --green: #7ccf86;
    --r1: #8d8a86;
    --r2: #b8743a;
    --r3: #c9d2dc;
    --r4: #f0c548;
    --lust: #c8457f;
    --luxury: #c99a2e;
    --conquest: #3f7fc8;
    --slaughter: #b8322e;
  }
  * { box-sizing: border-box; }
  html { background: var(--desk2); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); line-height: 1.45;
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    background:
      radial-gradient(ellipse at 50% -10%, #5a2a1e 0%, transparent 60%),
      repeating-linear-gradient(90deg, #ffffff05 0 2px, transparent 2px 7px),
      linear-gradient(180deg, var(--desk1), var(--desk2));
    background-attachment: fixed;
  }
  a { color: var(--gold); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 10px 14px 220px; }
  nav.games { font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; }
  nav.games a { color: var(--muted); text-decoration: none; }
  nav.games a.on { color: var(--gold2); }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; }
  h1 { margin: 0; font-size: 26px; color: var(--gold2); letter-spacing: 6px; text-shadow: 0 2px 0 #000; }
  .hud { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { border: 1px solid var(--line); background: #0004; border-radius: 999px; padding: 4px 12px; font-size: 14px; color: var(--muted); }
  .chip b { color: var(--gold2); margin-left: 4px; }
  .links { font-size: 14px; display: flex; gap: 10px; }
  h2 {
    font-size: 15px; color: var(--gold); margin: 18px 0 8px; letter-spacing: 3px; display: flex; align-items: center; gap: 10px;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  .rowscroll { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 10px; }
  .rites { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap: 12px; }

  /* Tarot-like cards */
  .gcard {
    flex: 0 0 auto; width: 112px; height: 168px; border-radius: 10px; position: relative; color: var(--ink);
    background: linear-gradient(160deg, var(--paper1), var(--paper2));
    border: 3px solid var(--r1); box-shadow: 0 6px 14px #000a, inset 0 0 0 2px #fff6, inset 0 0 18px #7a5a2a55;
    padding: 6px 7px; display: flex; flex-direction: column; align-items: center; cursor: grab; user-select: none; -webkit-user-select: none;
    touch-action: pan-x; transition: transform .12s, box-shadow .12s;
  }
  .gcard:hover { transform: translateY(-3px); }
  .gcard.sel { box-shadow: 0 0 0 3px var(--gold2), 0 8px 18px #000c; transform: translateY(-5px); }
  .gcard.locked { filter: grayscale(.7) brightness(.7); cursor: default; }
  .gcard.npc { border-style: dashed; }
  .gcard.rank1 { border-color: var(--r1); } .gcard.rank2 { border-color: var(--r2); }
  .gcard.rank3 { border-color: var(--r3); } .gcard.rank4 { border-color: var(--r4); box-shadow: 0 6px 14px #000a, 0 0 12px #f0c54888, inset 0 0 0 2px #fff6; }
  .gcard .rk { position: absolute; top: 4px; right: 5px; font-size: 11px; font-weight: 700; padding: 0 5px; border-radius: 6px; color: #1a0d0a; }
  .rk1 { background: var(--r1); } .rk2 { background: var(--r2); } .rk3 { background: var(--r3); } .rk4 { background: var(--r4); }
  .gcard .portrait {
    width: 50px; height: 50px; border-radius: 50%; margin-top: 4px; display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; color: var(--paper1); background: radial-gradient(circle at 35% 30%, #8a3b2a, #3a120c);
    border: 2px solid #7a5a2a;
  }
  .gcard .nm { font-weight: 700; font-size: 14px; margin-top: 3px; }
  .gcard .tt { font-size: 11px; color: #6a4a2a; }
  .gcard .at { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px 4px; font-size: 10.5px; margin-top: 3px; width: 100%; text-align: center; }
  .gcard .at span b { font-size: 11.5px; }
  .gcard .tags { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; margin-top: auto; }
  .gcard .tags i { font-style: normal; font-size: 10px; background: #5a2a1e; color: var(--paper1); border-radius: 4px; padding: 0 4px; }
  .gcard .status { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; font-size: 10px; background: #1a0d0acc; color: var(--gold2); border-radius: 0 0 7px 7px; }
  .gcard.coin .portrait { background: radial-gradient(circle at 35% 30%, #ffe9a0, #b8862a); color: #5a3a10; border-color: #8a6420; }
  .gcard.coin .big { font-size: 26px; font-weight: 700; margin-top: 10px; }
  .gcard.item .portrait { background: radial-gradient(circle at 35% 30%, #4a6aa0, #1a2440); }
  .gcard.item .desc { font-size: 11px; text-align: center; margin-top: 6px; color: #4a3220; }

  /* Sultan order cards */
  .order {
    flex: 0 0 auto; width: 120px; height: 180px; border-radius: 12px; position: relative; text-align: center;
    background: linear-gradient(170deg, #2a1410, #120806); border: 3px solid var(--r1); box-shadow: 0 8px 16px #000c, inset 0 0 0 2px #d9b26a33;
    padding: 10px 6px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  }
  .order .seal { font-size: 11px; color: var(--muted); letter-spacing: 2px; }
  .order .type { font-size: 30px; font-weight: 700; line-height: 1.15; display: flex; flex-direction: column; margin: 4px 0; }
  .order .left { font-size: 12px; color: var(--muted); }
  .order.urgent .left { color: var(--red); font-weight: 700; }
  .order.done { opacity: .45; }
  .order.done .left { color: var(--green); }

  /* Rites */
  .rite {
    background: linear-gradient(180deg, #3b2018, #24120d); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
    box-shadow: 0 6px 16px #0008, inset 0 0 0 1px #d9b26a22;
  }
  .rite.running { border-color: var(--gold); }
  .rite .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rite h3 { margin: 0; color: var(--gold2); font-size: 17px; letter-spacing: 2px; }
  .rite .days { font-size: 12px; color: var(--muted); }
  .rite p { margin: 4px 0 8px; font-size: 13px; color: var(--muted); }
  .slots { display: flex; gap: 8px; flex-wrap: wrap; }
  .slot {
    width: 70px; height: 96px; border-radius: 8px; border: 2px dashed #8a6a48; background: #0003; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 11px; color: var(--muted); padding: 4px; cursor: pointer;
  }
  .slot.req { border-color: var(--gold); }
  .slot.hover { background: #d9b26a33; border-style: solid; }
  .slot.filled { border-style: solid; background: linear-gradient(160deg, var(--paper1), var(--paper2)); color: var(--ink); font-weight: 700; font-size: 12px; }
  .slot.filled small { display: block; font-weight: 400; font-size: 10px; color: #6a4a2a; }
  .slot.filled.coin { background: radial-gradient(circle at 40% 35%, #ffe9a0, #c99a3a); }
  .rite .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
  .rite select { font: inherit; font-size: 13px; background: #0006; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  .rite .odds { color: var(--muted); flex: 1; min-width: 140px; }
  .rite .odds b { color: var(--gold2); }
  button {
    font: inherit; font-weight: 700; font-size: 14px; color: #1a0d0a; background: linear-gradient(180deg, #f3dca0, #c99a4a);
    border: 1px solid #7a5a2a; border-radius: 8px; padding: 7px 14px; cursor: pointer; box-shadow: 0 2px 0 #000a;
  }
  button.ghost { background: transparent; color: var(--gold2); border-color: var(--gold); box-shadow: none; }
  button:disabled { opacity: .4; cursor: default; }

  .events { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px; }
  .event {
    color: var(--ink); background: linear-gradient(170deg, var(--paper1), var(--paper2)); border-radius: 6px; padding: 12px 14px;
    box-shadow: 0 6px 14px #000a, inset 0 0 30px #7a5a2a44; border: 1px solid #7a5a2a;
  }
  .event h3 { margin: 0 0 4px; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; }
  .event h3 span { font-size: 12px; font-weight: 400; color: #6a4a2a; }
  .event p { margin: 0 0 8px; font-size: 14px; }
  .event .opts { display: flex; flex-direction: column; gap: 6px; }
  .event .opts button { text-align: left; font-weight: 400; background: #fff5; box-shadow: none; }

  /* Hand dock */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; padding: 6px 12px 8px;
    background: linear-gradient(180deg, #1a0d0ae6, #0d0605f2); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px #000a;
  }
  .dock .bar { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .dock .bar .lbl { font-size: 13px; color: var(--gold); letter-spacing: 2px; }
  .dock .bar .hint { font-size: 12px; color: var(--muted); flex: 1; }
  .dock .hand { max-width: 1180px; margin: 0 auto; display: flex; gap: 10px; overflow-x: auto; padding: 6px 2px 4px; }
  .ghostcard { position: fixed; z-index: 50; pointer-events: none; transform: rotate(-4deg) scale(1.05); opacity: .92; }

  #log { background: #0005; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; max-height: 240px; overflow: auto; font-size: 14px; }
  #log div { padding: 3px 0; border-bottom: 1px dashed #ffffff12; }
  #log .good { color: var(--green); } #log .bad { color: var(--red); } #log .gold { color: var(--gold2); }

  .overlay { position: fixed; inset: 0; background: #000b; display: none; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
  .overlay.show { display: flex; }
  .modal {
    color: var(--ink); background: linear-gradient(170deg, var(--paper1), var(--paper2)); border-radius: 8px; padding: 18px 20px;
    width: 100%; max-width: 480px; max-height: 88vh; overflow: auto; box-shadow: 0 20px 50px #000; border: 2px solid #7a5a2a;
  }
  .modal h3 { margin: 0 0 8px; font-size: 20px; text-align: center; letter-spacing: 3px; }
  .modal .res { border-top: 1px dashed #7a5a2a; padding: 10px 0; }
  .modal .res h4 { margin: 0 0 4px; }
  .dice { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  .die { width: 18px; height: 18px; border-radius: 4px; background: #5a4a3a; box-shadow: inset 0 -2px 0 #0005; }
  .die.hit { background: radial-gradient(circle at 40% 35%, #ffe9a0, #c99a2a); }
  .modal .btns { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .modal .ok { color: #2a6a30; font-weight: 700; } .modal .ng { color: #9a2a20; font-weight: 700; }
  .help { font-size: 14px; padding-left: 18px; }
  .help li { margin-bottom: 4px; }
  .shop { display: grid; gap: 8px; }
  .shop div { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px dashed #7a5a2a; padding: 6px 0; font-size: 14px; }
  .empty { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="games"><a href="../">Block Out</a><a class="on" href="./">蘇丹的遊戲</a><a href="../bounce/">Count and Bounce</a></nav>
  <header>
    <h1>蘇丹的遊戲</h1>
    <div class="hud">
      <div class="chip">第<b id="sDay">1</b> / 56 天</div>
      <div class="chip">金幣<b id="sGold">0</b></div>
      <div class="chip">每日俸祿<b id="sWage">0</b></div>
      <div class="chip">赦免令<b id="sPardon">0</b></div>
      <button id="btnEnd">結束這一天</button>
    </div>
  </header>
  <div class="links"><a href="#" id="lnkHelp">玩法說明</a><a href="#" id="lnkShop">市集</a><a href="#" id="lnkRestart">重新開始</a></div>

  <h2>蘇丹的旨意</h2>
  <div class="rowscroll" id="orders"></div>

  <h2>城中事件</h2>
  <div class="events" id="events"></div>

  <h2>儀式</h2>
  <div class="rites" id="rites"></div>

  <h2>城中人物</h2>
  <div class="rowscroll" id="npcs"></div>

  <h2>紀事</h2>
  <div id="log"></div>
</div>

<div class="dock">
  <div class="bar"><span class="lbl">你的牌</span><span class="hint" id="hint">拖曳卡牌放進儀式的卡槽，或先點卡牌再點卡槽。</span></div>
  <div class="hand" id="hand"></div>
</div>

<div class="overlay" id="box"><div class="modal" id="modal"></div></div>

<script>
(() => {
  const RANKS = ['', '石', '銅', '銀', '金'];
  const ATTRS = { body: '體魄', combat: '戰鬥', charm: '魅力', social: '社交', wit: '智慧', stealth: '隱匿' };
  const TYPES = {
    lust: { name: '縱慾', color: 'var(--lust)', text: '蘇丹要你縱情聲色，讓全城都聽聞你的荒唐。' },
    luxury: { name: '奢靡', color: 'var(--luxury)', text: '蘇丹要你一擲千金，揮霍到令人咋舌。' },
    conquest: { name: '征服', color: 'var(--conquest)', text: '蘇丹要你讓某人臣服於你的腳下。' },
    slaughter: { name: '殺戮', color: 'var(--slaughter)', text: '蘇丹要你取一個人的性命。' },
  };
  const NAMES = ['阿米爾', '法蒂瑪', '哈桑', '萊拉', '卡西姆', '札拉', '薩利姆', '努爾', '哈里德', '席琳',
    '塔里克', '米莉亞', '奧馬爾', '娜迪亞', '拉希德', '薩拉', '易卜拉欣', '阿伊莎', '賈法爾', '露珀', '穆斯塔法', '海雅'];
  const ROLES = {
    1: [['奴隸', 'body'], ['乞丐', 'stealth'], ['挑夫', 'body'], ['賣花女', 'charm']],
    2: [['商人', 'social'], ['衛兵', 'combat'], ['舞姬', 'charm'], ['竊賊', 'stealth']],
    3: [['學者', 'wit'], ['將軍', 'combat'], ['祭司', 'social'], ['刺客', 'stealth']],
    4: [['公主', 'charm'], ['維齊爾', 'wit'], ['王子', 'combat'], ['影衛長', 'stealth']],
  };
  // Traits add dice to matching rites, or change wages.
  const TRAITS = {
    美貌: { feast: 2, recruit: 2 }, 嗜血: { kill: 2 }, 精明: { trade: 2 }, 虔誠: { train: 2 },
    健談: { tavern: 2, recruit: 1 }, 忠誠: { wage: -9 }, 貪婪: { wage: 1, trade: 1 },
  };
  const WAGE = [0, 0, 1, 2, 3];
  const ITEMS = [
    { name: '大馬士革彎刀', ch: '刃', desc: '暗殺 +3 骰', bonus: { kill: 3 }, price: 9 },
    { name: '玫瑰香膏', ch: '香', desc: '夜宴、招攬 +3 骰', bonus: { feast: 3, recruit: 3 }, price: 9 },
    { name: '星象古卷', ch: '卷', desc: '修練、經商 +3 骰', bonus: { train: 3, trade: 3 }, price: 9 },
    { name: '陳年葡萄酒', ch: '酒', desc: '酒館、夜宴 +2 骰', bonus: { tavern: 2, feast: 2 }, price: 6 },
    { name: '夜行斗篷', ch: '影', desc: '暗殺、招攬 +2 骰', bonus: { kill: 2, recruit: 2 }, price: 7 },
  ];
  const LAST_DAY = 56;
  const TIER_GOLD = { feast: [0, 3, 8, 15, 25], squander: [0, 5, 12, 25, 40] };

  // Rites sit on the table as cards with slots. A rite takes some days; the
  // cards placed in it are locked until it resolves at the end of a day.
  const RITES = {
    trade: { name: '經商', days: 1, attrs: ['wit', 'social'], desc: '在市集上周旋買賣。成功數越多，賺得越多。',
      slots: [['actor', '人物', 1], ['actor', '人物'], ['item', '物品']], need: () => 1 },
    tavern: { name: '酒館', days: 1, attrs: ['charm', 'social'], desc: '請客喝酒，結識城中人物。成功越多，越可能遇見大人物。',
      slots: [['actor', '人物', 1], ['gold', '金幣 2', 1, 2], ['item', '物品']], need: () => 0 },
    recruit: { name: '招攬', days: 2, attrs: ['charm', 'social'], desc: '說服城中人物成為門客。可完成【征服】旨意。需要成功數：對方等級 x2。',
      slots: [['npc', '目標', 1], ['actor', '人物', 1], ['actor', '人物'], ['item', '物品']], need: t => (t ? t.rank * 2 : 0) },
    kill: { name: '暗殺', days: 2, attrs: ['combat', 'stealth'], desc: '取人性命。可完成【殺戮】旨意。需要成功數：對方等級 x2（自己的門客只需 1）。失敗時參與者可能喪命。',
      slots: [['target', '目標', 1], ['actor', '人物', 1], ['actor', '人物'], ['item', '物品']], need: t => (t ? (t.follower ? 1 : t.rank * 2) : 0) },
    feast: { name: '夜宴', days: 1, attrs: ['charm', 'social'], tier: 'feast', desc: '舉辦縱情的夜宴。可完成【縱慾】旨意。需要成功數：等級 x2。',
      slots: [['actor', '人物', 1], ['actor', '人物'], ['gold', '金幣', 1], ['item', '物品']], need: (t, tier) => tier * 2 },
    squander: { name: '揮霍', days: 1, attrs: [], tier: 'squander', desc: '把金幣撒向街頭、熔成雕像、餵給孔雀。直接完成【奢靡】旨意。',
      slots: [['gold', '金幣', 1]], need: () => 0 },
    train: { name: '修練', days: 3, attrs: ['wit'], train: true, desc: '閉門苦修，提升一項屬性 1 點（4 次以上成功提升 2 點）。需要成功數：2。',
      slots: [['actor', '人物', 1], ['item', '物品']], need: () => 2 },
  };

  const $ = id => document.getElementById(id);
  const rand = n => Math.floor(Math.random() * n);
  const pick = a => a[rand(a.length)];
  let S, nextId, selected = null;

  function makePerson(rank, follower) {
    const [title, main] = pick(ROLES[rank]);
    const stats = { body: 0, combat: 0, charm: 0, social: 0, wit: 0, stealth: 0 };
    let points = 2 + rank * 4;
    stats[main] += 2;
    points -= 2;
    const keys = Object.keys(stats);
    while (points-- > 0) stats[Math.random() < 0.3 ? main : pick(keys)]++;
    const used = new Set(S ? S.people.map(p => p.name) : []);
    const name = pick(NAMES.filter(n => !used.has(n))) || pick(NAMES);
    const traits = Math.random() < 0.6 ? [pick(Object.keys(TRAITS))] : [];
    return { id: nextId++, name, title, rank, stats, follower, traits, you: false };
  }

  function newGame() {
    nextId = 1;
    S = null;
    S = { day: 1, gold: 12, people: [], items: [], sultan: [], done: 0, log: [], over: false, events: [], queue: [], flags: {}, pardon: 0, rites: {} };
    S.people.push({ id: nextId++, name: '你', title: '蘇丹的寵臣', rank: 2, follower: true, you: true, traits: ['精明'],
      stats: { body: 2, combat: 2, charm: 3, social: 3, wit: 3, stealth: 2 } });
    S.people.push({ id: nextId++, name: '妻子', title: '你的妻子', rank: 2, follower: true, traits: ['忠誠', '美貌'],
      stats: { body: 1, combat: 0, charm: 4, social: 3, wit: 2, stealth: 1 } });
    S.people.push({ id: nextId++, name: '老僕', title: '家僕', rank: 1, follower: true, traits: ['忠誠'],
      stats: { body: 3, combat: 1, charm: 0, social: 1, wit: 1, stealth: 2 } });
    S.people.push(makePerson(1, false));
    S.people.push(makePerson(2, false));
    for (const k of Object.keys(RITES)) S.rites[k] = emptyRite(k);
    log('蘇丹在宮殿深處微笑：「我們來玩一個遊戲吧。」', 'gold');
    startDay();
  }

  function emptyRite(k) {
    return { slots: RITES[k].slots.map(() => null), running: false, daysLeft: 0, tier: 1, attr: 'wit' };
  }

  function log(text, cls = '') {
    S.log.unshift({ day: S.day, text, cls });
    S.log = S.log.slice(0, 150);
  }

  function sultanRank(week) {
    const table = [[1], [1, 2], [2], [2, 3], [3], [3, 4], [3, 4, 4], [4]];
    return pick(table[Math.min(week, 8) - 1]);
  }

  // ---- Card locations ----
  const byId = id => S.people.find(p => p.id === id) || S.items.find(i => i.id === id);
  function placedIn(id) {
    for (const [k, r] of Object.entries(S.rites)) if (r.slots.includes(id)) return k;
    return null;
  }
  const isLocked = id => { const k = placedIn(id); return !!(k && S.rites[k].running); };
  const idle = () => S.people.filter(p => p.follower && !placedIn(p.id));
  const label = p => `${p.name}（${RANKS[p.rank]}・${p.title}）`;
  const wageOf = p => (p.you ? 0 : Math.max(0, WAGE[p.rank] + p.traits.reduce((s, t) => s + (TRAITS[t].wage || 0), 0)));

  function startDay() {
    if ((S.day - 1) % 7 === 0) {
      const week = (S.day - 1) / 7 + 1;
      const type = pick(Object.keys(TYPES));
      const card = { id: nextId++, type, rank: sultanRank(week), deadline: S.day + 6, done: false };
      S.sultan.push(card);
      log(`第 ${week} 週。蘇丹賜下旨意：【${RANKS[card.rank]}・${TYPES[type].name}】。${TYPES[type].text}`, 'gold');
    }
    spawnEvents();
    save();
    render();
  }

  function endDay() {
    if (S.over) return;
    selected = null;
    const results = [];
    for (const [k, r] of Object.entries(S.rites)) {
      if (!r.running) continue;
      r.daysLeft--;
      if (r.daysLeft <= 0) results.push(resolveRite(k));
      if (S.over) return;
    }
    for (const failed of S.sultan.filter(c => !c.done && c.deadline <= S.day)) {
      if (S.pardon > 0) {
        S.pardon--;
        failed.done = true;
        log(`【${RANKS[failed.rank]}・${TYPES[failed.type].name}】的期限已到。你呈上赦免令，蘇丹撇撇嘴放過了你。`, 'gold');
        continue;
      }
      return ending(false, '處決', `【${RANKS[failed.rank]}・${TYPES[failed.type].name}】的期限已到。侍衛把你拖到廣場，蘇丹打了個呵欠。`, results);
    }
    for (const p of S.people.filter(p => p.follower && !p.you)) {
      const wage = wageOf(p);
      if (!wage) continue;
      if (S.gold >= wage) S.gold -= wage;
      else {
        p.follower = false;
        removeFromRites(p.id);
        log(`付不出俸祿，${label(p)}離你而去。`, 'bad');
      }
    }
    if (S.day >= LAST_DAY) return ending(true, '倖存', '八週過去，蘇丹厭倦了這個遊戲。你活了下來——至少現在是。', results);
    S.day++;
    const drifters = S.people.filter(p => !p.follower && !p.quest && !placedIn(p.id));
    if (drifters.length > 3 && Math.random() < 0.3) {
      const gone = pick(drifters);
      S.people = S.people.filter(p => p !== gone);
      log(`${label(gone)}離開了城市。`);
    }
    startDay();
    if (results.length) showResults(results);
  }

  function removeFromRites(id) {
    for (const r of Object.values(S.rites)) r.slots = r.slots.map(s => (s === id ? null : s));
  }

  // ---- Dice ----
  function chance(n, k) {
    if (k <= 0) return 1;
    if (n < k) return 0;
    let total = 0, c = 1;
    for (let i = 0; i <= n; i++) {
      if (i >= k) total += c;
      c = (c * (n - i)) / (i + 1);
    }
    return total / Math.pow(2, n);
  }
  const rollDice = n => Array.from({ length: n }, () => Math.random() < 0.5);
  const dice = (ps, attr) => ps.reduce((s, p) => s + p.stats[attr], 0);

  function riteParts(k) {
    const def = RITES[k], r = S.rites[k];
    const parts = { actors: [], target: null, item: null, gold: false };
    def.slots.forEach(([type], i) => {
      const id = r.slots[i];
      if (id == null) return;
      if (type === 'actor') parts.actors.push(byId(id));
      else if (type === 'npc' || type === 'target') parts.target = byId(id);
      else if (type === 'item') parts.item = byId(id);
      else if (type === 'gold') parts.gold = true;
    });
    return parts;
  }
  function goldNeed(k) {
    const def = RITES[k];
    if (def.tier) return TIER_GOLD[def.tier][S.rites[k].tier];
    const g = def.slots.find(s => s[0] === 'gold');
    return g ? g[3] : 0;
  }
  function riteDice(k) {
    const def = RITES[k], { actors, item } = riteParts(k);
    const attrs = def.attrs;
    let n = actors.reduce((s, p) => s + attrs.reduce((a, at) => a + p.stats[at], 0) + p.traits.reduce((b, t) => b + (TRAITS[t][k] || 0), 0), 0);
    if (item) n += item.bonus[k] || 0;
    return n;
  }
  const riteNeed = k => RITES[k].need(riteParts(k).target, S.rites[k].tier);
  function riteReady(k) {
    const def = RITES[k], r = S.rites[k];
    return def.slots.every(([, , req], i) => !req || r.slots[i] != null);
  }

  function startRite(k) {
    const r = S.rites[k];
    if (r.running || !riteReady(k)) return;
    const need = goldNeed(k);
    if (S.gold < need) return;
    S.gold -= need;
    r.goldPaid = need;
    r.running = true;
    r.daysLeft = RITES[k].days;
    const { actors, target } = riteParts(k);
    log(`【${RITES[k].name}】開始。${actors.map(p => p.name).join('、')}${target ? `，目標：${target.name}` : ''}。需要 ${RITES[k].days} 天。`);
    save();
    render();
  }

  function resolveRite(k) {
    const def = RITES[k], r = S.rites[k];
    const { actors, target, item } = riteParts(k);
    const n = riteDice(k), need = riteNeed(k);
    const roll = def.attrs.length ? rollDice(n) : [];
    const s = roll.filter(Boolean).length;
    const ok = s >= need;
    const res = { name: def.name, roll, need, ok, text: '' };
    const say = (t, cls) => { res.text += t; log(`【${def.name}】${t}`, cls); };
    if (item) S.items = S.items.filter(i => i !== item);

    if (k === 'trade') {
      const gain = 4 + s * 3;
      S.gold += gain;
      say(`${actors.map(p => p.name).join('、')}經商歸來，帶回 ${gain} 金幣。`, 'good');
      res.ok = true;
    } else if (k === 'tavern') {
      const week = Math.ceil(S.day / 7);
      const rank = Math.max(1, Math.min(4, 1 + Math.floor((s + rand(3) + week / 2) / 3)));
      const np = makePerson(rank, false);
      S.people.push(np);
      say(`${actors[0].name}在酒館結識了${label(np)}。`, 'good');
      res.ok = true;
    } else if (k === 'recruit') {
      if (ok && S.people.includes(target)) {
        target.follower = true;
        say(`${label(target)}跪在你面前，宣誓效忠。`, 'good');
        fulfil('conquest', target.rank);
      } else say(`${target.name}對你的提議嗤之以鼻。`, 'bad');
    } else if (k === 'kill') {
      if (ok && S.people.includes(target)) {
        S.people = S.people.filter(p => p !== target);
        removeFromRites(target.id);
        say(`${label(target)}倒在血泊中。${target.follower ? '曾經的追隨者，再也不會說話了。' : ''}`, 'bad');
        fulfil('slaughter', target.rank);
        onKilled(target);
      } else {
        say(`暗殺${target.name}失敗了。`, 'bad');
        const victims = actors.filter(p => !p.you);
        if (victims.length && Math.random() < 0.4) {
          const v = pick(victims);
          S.people = S.people.filter(p => p !== v);
          removeFromRites(v.id);
          say(`${label(v)}在混戰中喪命。`, 'bad');
        }
      }
    } else if (k === 'feast') {
      if (ok) { say(`一場${RANKS[r.tier]}級的夜宴徹夜未歇，滿城皆知。`, 'good'); fulfil('lust', r.tier); }
      else say('夜宴冷冷清清，賓客早早散去。金幣白白花掉了。', 'bad');
    } else if (k === 'squander') {
      say(`你揮霍了 ${r.goldPaid} 金幣。百姓目瞪口呆。`, 'gold');
      fulfil('luxury', r.tier);
      res.ok = true;
    } else if (k === 'train') {
      const p = actors[0];
      if (ok) {
        const up = s >= 4 ? 2 : 1;
        p.stats[r.attr] += up;
        say(`${p.name}的${ATTRS[r.attr]}提升了 ${up} 點。`, 'good');
      } else say(`${p.name}苦修三日，毫無所得。`);
    }
    const keep = { tier: r.tier, attr: r.attr };
    S.rites[k] = Object.assign(emptyRite(k), keep);
    return res;
  }

  function fulfil(type, rank) {
    const card = S.sultan.filter(c => !c.done && c.type === type && c.rank <= rank).sort((a, b) => a.deadline - b.deadline)[0];
    if (!card) return;
    card.done = true;
    S.done++;
    log(`你完成了蘇丹的旨意【${RANKS[card.rank]}・${TYPES[type].name}】。蘇丹賞你 ${card.rank * 3} 金幣。`, 'gold');
    S.gold += card.rank * 3;
  }

  // ---- Side stories ----
  // A choice with a check is rolled by your three best idle followers.
  const bestGroup = attr => idle().sort((a, b) => b.stats[attr] - a.stats[attr]).slice(0, 3);
  function test(attr, need) {
    const ps = bestGroup(attr);
    const s = rollDice(dice(ps, attr)).filter(Boolean).length;
    log(`${ps.map(p => p.name).join('、') || '無人'}進行${ATTRS[attr]}判定，擲出 ${s} 次成功（需要 ${need}）。`);
    return s >= need;

  const week = () => Math.ceil(S.day / 7);
  const others = () => S.people.filter(p => p.follower && !p.you && !isLocked(p.id));
  function loseFollower(reason) {
    const v = pick(others());

    S.people = S.people.filter(p => p !== v);
    removeFromRites(v.id);
    log(`${label(v)}${reason}`, 'bad');

  }

  }

    const type = pick(Object.keys(TYPES));

    log(`蘇丹起了疑心，追加一道旨意：【${RANKS[card.rank]}・${TYPES[type].name}】，限 ${days} 天內完成。`, 'bad');
  }

  }

        } },
        { label: '花錢消災', cost: 10, run() { log('你把錢袋扔出窗外，腳步聲遠去了。'); } },
      ],
    },
    plague: {
      title: '瘟疫', once: true, minWeek: 2, ttl: 2,
      text: '城南爆發瘟疫，你的門客中有人開始咳嗽。',
      options: () => [
        { label: '買藥', cost: 8, run() { log('藥很苦，但大家都撐過來了。', 'good'); } },
        { label: '聽天由命', run() { if (Math.random() < 0.5) loseFollower('死於瘟疫。'); else log('幸運的是，咳嗽漸漸停了。'); } },
      ],
    },
    nobleFeast: {
      title: '貴族的夜宴', text: '一位貴族邀你參加他的夜宴，據說會有很多「娛樂」。',
      options: () => [
        { label: '赴宴並大出風頭', check: ['charm', 3], run(ok) {

            log('你成了全場焦點，酒池肉林，荒唐至極。', 'good');
            fulfil('lust', 2);
            const np = makePerson(3, false); S.people.push(np); log(`你在宴會上結識了${label(np)}。`);
          } else log('你在宴會上出了醜，早早離席。');
        } },
        { label: '婉拒', run() {} },
      ],
    },
    gamble: {
      title: '地下賭場', text: '骰子在骨碗裡叮噹作響。「大人，來一把？」',
      options: () => [
        { label: '下注', cost: 5, run() {
          if (Math.random() < 0.45) { S.gold += 12; log('你贏了 12 金幣！', 'good'); } else log('骰子不站在你這邊。', 'bad');
        } },
        { label: '離開', run() {} },
      ],
    },
    summon: {
      title: '蘇丹召見', ttl: 1, text: '蘇丹突然召見你：「我無聊了。給我講個故事。」',
      options: () => [{ label: '講一個故事', check: ['wit', 3], run(ok) {
        const c = S.sultan.filter(c => !c.done).sort((a, b) => a.deadline - b.deadline)[0];
        if (ok) {
          if (c) c.deadline = Math.min(c.deadline + 2, LAST_DAY);
          log(`蘇丹聽得入迷${c ? '，寬限了你 2 天' : '，賞你 6 金幣'}。`, 'good');
          if (!c) S.gold += 6;
        } else { S.gold = Math.max(0, S.gold - 5); log('蘇丹打了個呵欠，罰你 5 金幣。', 'bad'); }
      } }],
    },
    thief: {
      title: '金庫失竊', ttl: 1, cond: () => S.gold >= 8,
      text: '你的金庫被撬開了，地上留著一串腳印。',
      options: () => [
        { label: '追查竊賊', check: ['stealth', 2], run(ok) {
          if (ok) { log('你在貧民窟抓到了竊賊。她跪地求饒，願意為你效力。', 'good'); addFollower(2, '竊賊'); }
          else { const l = Math.floor(S.gold / 4); S.gold -= l; log(`竊賊逃走了，你損失 ${l} 金幣。`, 'bad'); }
        } },
        { label: '認了', run() { const l = Math.floor(S.gold / 4); S.gold -= l; log(`你損失 ${l} 金幣。`, 'bad'); } },
      ],
    },
    merchant: {
      title: '神秘商人', minWeek: 2, text: '一個戴面紗的商人低聲說：「我有蘇丹親筆簽名的赦免令，只要 35 金幣。」',
      options: () => [
        { label: '買下赦免令', cost: 35, run() { pardon(); } },
        { label: '離開', run() {} },
      ],
    },
  };
  const RANDOM_EVENTS = ['beggar', 'caravan', 'vizier', 'princess', 'rebels', 'astro', 'assassins', 'plague', 'nobleFeast', 'gamble', 'summon', 'thief', 'merchant'];

  function rebelProgress() {
    S.flags.rebels++;
    log(`反抗軍的力量壯大了。（起義準備度：${S.flags.rebels - 1} / 3）`, 'good');
    if (S.flags.rebels >= 4) { schedule('rebelUprising', 2); log('首領傳話：起義的時機快到了。', 'gold'); }
    else schedule('rebelTask', 3);
  }

  function rebelProgress() {
    S.flags.rebels++;
    log(`反抗軍的力量壯大了。（起義準備度：${S.flags.rebels - 1} / 3）`, 'good');
    if (S.flags.rebels >= 4) { schedule('rebelUprising', 2); log('首領傳話：起義的時機快到了。', 'gold'); }
    else schedule('rebelTask', 3);
  }

  function addEvent(key) {
    const ev = EVENTS[key];
    S.events.push({ id: nextId++, key, expires: S.day + (ev.ttl || 3) - 1 });
    if (ev.once) S.flags['seen_' + key] = true;
  }

  function spawnEvents() {
    S.events = S.events.filter(e => e.expires >= S.day);
    S.queue.filter(q => q.day === S.day).forEach(q => { if (!EVENTS[q.key].cond || EVENTS[q.key].cond()) addEvent(q.key); });
    S.queue = S.queue.filter(q => q.day > S.day);
    if (S.events.length >= 3 || Math.random() > 0.5) return;
    const pool = RANDOM_EVENTS.filter(k => {
      const ev = EVENTS[k];
      return !(ev.once && S.flags['seen_' + k]) && week() >= (ev.minWeek || 1) && (!ev.cond || ev.cond()) && !S.events.some(e => e.key === k);
    });
    if (pool.length) addEvent(pick(pool));
  }

  function chooseEvent(id, idx) {
    const e = S.events.find(e => e.id === id);
    if (!e || S.over) return;
    const ev = EVENTS[e.key];
    const opt = ev.options()[idx];
    if (opt.cost && S.gold < opt.cost) return;
    if (opt.cost) S.gold -= opt.cost;
    S.events = S.events.filter(x => x !== e);
    log(`【${ev.title}】你選擇：${opt.label}。`);
    opt.run(opt.check ? test(...opt.check) : true);
    if (S.over) return;
    save();
    render();
  }

  function onKilled(t) {
    if (t.quest === 'vizier' && S.flags.vizier === t.id) {
      S.flags.vizier = 'done';
      S.gold += 20;
      log('維齊爾很滿意：「你是個有用的人。」他給了你 20 金幣。', 'gold');
      pardon();
    }
  }

  function ending(win, title, text, results) {
    S.over = true;
    log(`結局【${title}】${text}`, win ? 'good' : 'bad');
    try {
      const seen = JSON.parse(localStorage.getItem('sultan.endings') || '[]');
      if (!seen.includes(title)) localStorage.setItem('sultan.endings', JSON.stringify(seen.concat(title)));
    } catch (e) {}
    save();
    render();
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem('sultan.endings') || '[]'); } catch (e) {}
    showModal(`<h3>結局：${title}</h3><p>${text}</p><p>你完成了 ${S.done} 道旨意，撐到第 ${S.day} 天。</p>
      <p style="font-size:13px">已解鎖的結局：${seen.join('、') || title}</p>
      <div class="btns"><button id="btnAgain">再玩一次</button></div>`);
    $('btnAgain').onclick = () => { hideModal(); newGame(); };
  }

  // ---- Placing cards ----
  function accepts(type, card) {
    if (!card) return false;
    if (type === 'actor') return !!card.stats && card.follower;
    if (type === 'npc') return !!card.stats && !card.follower;
    if (type === 'target') return !!card.stats && !card.you;
    if (type === 'item') return card.kind === 'item';
    if (type === 'gold') return card.kind === 'gold';
    return false;
  }
  const GOLD_CARD = { id: -1, kind: 'gold' };
  const cardById = id => (id === -1 ? GOLD_CARD : byId(id));

  function place(k, i, id) {
    const r = S.rites[k];
    if (r.running || S.over) return false;
    const type = RITES[k].slots[i][0];
    const card = cardById(id);
    if (!accepts(type, card)) return flash(`這個卡槽放不了這張牌。`);
    if (id !== -1 && isLocked(id)) return flash('這張牌正在其他儀式中。');
    if (id !== -1) removeFromRites(id);
    if (type === 'gold' && S.gold < goldNeed(k)) return flash(`金幣不足，需要 ${goldNeed(k)}。`);
    r.slots[i] = id;
    selected = null;
    save();
    render();
    return true;
  }
  function flash(msg) {
    $('hint').textContent = msg;
    $('hint').style.color = 'var(--red)';
    clearTimeout(flash.t);
    flash.t = setTimeout(() => { $('hint').textContent = '拖曳卡牌放進儀式的卡槽，或先點卡牌再點卡槽。'; $('hint').style.color = ''; }, 1800);
    return false;
  }

  // Pointer drag with a floating copy of the card; a tap selects instead.
  let drag = null;
  document.addEventListener('pointerdown', ev => {
    const el = ev.target.closest('.gcard[data-id]');
    if (!el || el.classList.contains('locked') || S.over) return;
    drag = { id: +el.dataset.id, el, x: ev.clientX, y: ev.clientY, moved: false, ghost: null };
  });
  document.addEventListener('pointermove', ev => {
    if (!drag) return;
    if (!drag.moved && Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) < 8) return;
    if (!drag.moved) {
      drag.moved = true;
      drag.ghost = drag.el.cloneNode(true);
      drag.ghost.classList.add('ghostcard');
      document.body.appendChild(drag.ghost);
    }
    ev.preventDefault();
    drag.ghost.style.left = ev.clientX - 56 + 'px';
    drag.ghost.style.top = ev.clientY - 84 + 'px';
    document.querySelectorAll('.slot.hover').forEach(s => s.classList.remove('hover'));
    const slot = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.slot');
    if (slot) slot.classList.add('hover');
  }, { passive: false });
  document.addEventListener('pointercancel', () => {
    if (drag && drag.ghost) drag.ghost.remove();
    drag = null;
  });
  document.addEventListener('pointerup', ev => {
    if (!drag) return;
    const d = drag;
    drag = null;
    if (d.ghost) d.ghost.remove();
    document.querySelectorAll('.slot.hover').forEach(s => s.classList.remove('hover'));
    if (d.moved) {
      const slot = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.slot');
      if (slot) place(slot.dataset.rite, +slot.dataset.i, d.id);
    } else {
      selected = selected === d.id ? null : d.id;
      render();
    }
  });

  function clickSlot(k, i) {
    const r = S.rites[k];
    if (r.running) return;
    if (selected != null) return place(k, i, selected);
    if (r.slots[i] != null) { r.slots[i] = null; save(); render(); }
  }

  // ---- Rendering ----
  function cardHTML(c, extra = '') {
    if (c.kind === 'gold') {
      return `<div class="gcard coin ${selected === -1 ? 'sel' : ''}" data-id="-1"><div class="portrait">金</div>
        <div class="big">${S.gold}</div><div class="tt">金幣</div><div class="tags"><i>拖進金幣槽</i></div></div>`;
    }
    if (c.kind === 'item') {
      const where = placedIn(c.id);
      return `<div class="gcard item rank2 ${isLocked(c.id) ? 'locked' : ''} ${selected === c.id ? 'sel' : ''}" data-id="${c.id}">
        <div class="portrait">${c.ch}</div><div class="nm">${c.name}</div><div class="desc">${c.desc}</div>
        <div class="tags"><i>用後消耗</i></div>${where ? `<div class="status">${RITES[where].name}</div>` : ''}</div>`;
    }
    const where = placedIn(c.id);
    const at = Object.entries(ATTRS).map(([k, v]) => `<span>${v}<b>${c.stats[k]}</b></span>`).join('');
    const tags = c.traits.map(t => `<i>${t}</i>`).join('') + (c.follower && wageOf(c) ? `<i>俸 ${wageOf(c)}</i>` : '');
    return `<div class="gcard rank${c.rank} ${c.follower ? '' : 'npc'} ${isLocked(c.id) ? 'locked' : ''} ${selected === c.id ? 'sel' : ''} ${extra}" data-id="${c.id}">
      <span class="rk rk${c.rank}">${RANKS[c.rank]}</span>
      <div class="portrait">${c.you ? '我' : c.name[0]}</div><div class="nm">${c.name}</div><div class="tt">${c.title}</div>
      <div class="at">${at}</div><div class="tags">${tags}</div>
      ${where ? `<div class="status">${S.rites[where].running ? `${RITES[where].name}中・剩 ${S.rites[where].daysLeft} 天` : `已放入${RITES[where].name}`}</div>` : ''}</div>`;
  }

  function riteHTML(k) {
    const def = RITES[k], r = S.rites[k];
    const slots = def.slots.map(([type, lbl, req, amt], i) => {
      const id = r.slots[i];
      let inner = `${lbl}${req ? '<br>（必要）' : ''}`, cls = '';
      if (id != null) {
        cls = 'filled' + (id === -1 ? ' coin' : '');
        inner = id === -1 ? `金幣<small>${goldNeed(k)} 枚</small>` : `${cardById(id).name}<small>${cardById(id).title || cardById(id).desc || ''}</small>`;
      } else if (type === 'gold') inner = `金幣 ${goldNeed(k)}<br>（必要）`;
      return `<div class="slot ${req ? 'req' : ''} ${cls}" data-rite="${k}" data-i="${i}">${inner}</div>`;
    }).join('');
    let ctl = '';
    if (def.tier) {
      ctl += `<select data-tier="${k}" ${r.running ? 'disabled' : ''}>${[1, 2, 3, 4].map(t => `<option value="${t}" ${r.tier === t ? 'selected' : ''}>${RANKS[t]}級・${TIER_GOLD[def.tier][t]} 金幣</option>`).join('')}</select>`;
    }
    if (def.train) {
      ctl += `<select data-attr="${k}" ${r.running ? 'disabled' : ''}>${Object.entries(ATTRS).map(([a, v]) => `<option value="${a}" ${r.attr === a ? 'selected' : ''}>提升${v}</option>`).join('')}</select>`;
    }
    let odds;
    if (r.running) odds = `進行中，還剩 <b>${r.daysLeft}</b> 天`;
    else if (!def.attrs.length) odds = '無需判定';
    else if (!riteReady(k)) odds = '放滿必要卡槽後顯示成功率';
    else {
      const n = riteDice(k), need = riteNeed(k);
      odds = `骰子 <b>${n}</b>，需 <b>${need}</b> 成功，成功率 <b>${Math.round(chance(n, need) * 100)}%</b>`;
    }
    const can = !r.running && riteReady(k) && S.gold >= goldNeed(k) && !S.over;
    return `<div class="rite ${r.running ? 'running' : ''}">
      <div class="top"><h3>${def.name}</h3><span class="days">需 ${def.days} 天${def.attrs.length ? `・判定：${def.attrs.map(a => ATTRS[a]).join('＋')}` : ''}</span></div>
      <p>${def.desc}</p><div class="slots">${slots}</div>
      <div class="ctl">${ctl}<span class="odds">${odds}</span>${r.running ? '' : `<button data-start="${k}" ${can ? '' : 'disabled'}>開始儀式</button>`}</div></div>`;
  }

  function render() {
    $('sDay').textContent = S.day;
    $('sGold').textContent = S.gold;
    $('sWage').textContent = S.people.filter(p => p.follower).reduce((s, p) => s + wageOf(p), 0);
    $('sPardon').textContent = S.pardon;
    $('btnEnd').disabled = S.over;

    $('orders').innerHTML = S.sultan.slice(-5).map(c => {
      const left = c.deadline - S.day + 1;
      return `<div class="order ${c.done ? 'done' : ''} ${!c.done && left <= 2 ? 'urgent' : ''}" style="border-color:var(--r${c.rank})">
        <div class="seal">${RANKS[c.rank]}・蘇丹之令</div>
        <div class="type" style="color:${TYPES[c.type].color}">${[...TYPES[c.type].name].map(ch => `<span>${ch}</span>`).join('')}</div>
        <div class="left">${c.done ? '已完成' : left <= 1 ? '今日為限' : `剩餘 ${left} 天`}</div></div>`;
    }).join('');

    $('events').innerHTML = S.events.length ? S.events.map(e => {
      const ev = EVENTS[e.key];
      const text = typeof ev.text === 'function' ? ev.text() : ev.text;
      const left = e.expires - S.day + 1;
      const opts = ev.options().map((o, i) => {
        let extra = '';
        if (o.cost) extra = `（${o.cost} 金幣）`;
        if (o.check) {
          const [attr, need] = o.check;
          extra = `（${ATTRS[attr]} 需 ${need}，${Math.round(chance(dice(bestGroup(attr), attr), need) * 100)}%）`;
        }
        const dis = S.over || (o.cost && S.gold < o.cost) ? 'disabled' : '';
        return `<button data-e="${e.id}" data-o="${i}" ${dis}>${o.label}${extra}</button>`;
      }).join('');
      return `<div class="event"><h3>${ev.title}<span>${left <= 1 ? '今日為限' : `剩 ${left} 天`}</span></h3><p>${text}</p><div class="opts">${opts}</div></div>`;
    }).join('') : '<div class="empty">今天城裡風平浪靜。</div>';

    $('rites').innerHTML = Object.keys(RITES).map(riteHTML).join('');
    const npcs = S.people.filter(p => !p.follower);
    $('npcs').innerHTML = npcs.length ? npcs.map(p => cardHTML(p)).join('') : '<div class="empty">城裡沒有你認識的人。去酒館看看吧。</div>';
    $('hand').innerHTML = [GOLD_CARD, ...S.people.filter(p => p.follower), ...S.items].map(c => cardHTML(c)).join('');
    $('log').innerHTML = S.log.map(l => `<div class="${l.cls}">第 ${l.day} 天｜${l.text}</div>`).join('');

    document.querySelectorAll('[data-e]').forEach(b => (b.onclick = () => chooseEvent(+b.dataset.e, +b.dataset.o)));
    document.querySelectorAll('.slot').forEach(s => (s.onclick = () => clickSlot(s.dataset.rite, +s.dataset.i)));
    document.querySelectorAll('[data-start]').forEach(b => (b.onclick = () => startRite(b.dataset.start)));
    document.querySelectorAll('[data-tier]').forEach(sel => (sel.onchange = () => {
      const k = sel.dataset.tier;
      S.rites[k].tier = +sel.value;
      S.rites[k].slots = S.rites[k].slots.map((id, i) => (RITES[k].slots[i][0] === 'gold' ? null : id));
      render();
    }));
    document.querySelectorAll('[data-attr]').forEach(sel => (sel.onchange = () => { S.rites[sel.dataset.attr].attr = sel.value; render(); }));
  }

  function showModal(html) { $('modal').innerHTML = html; $('box').classList.add('show'); }
  function hideModal() { $('box').classList.remove('show'); }

  function showResults(results) {
    showModal(`<h3>儀式結果</h3>` + results.map(r => `<div class="res"><h4>${r.name}　<span class="${r.ok ? 'ok' : 'ng'}">${r.ok ? '成功' : '失敗'}</span></h4>
      ${r.roll.length ? `<div class="dice">${r.roll.map(h => `<span class="die ${h ? 'hit' : ''}"></span>`).join('')}</div>
      <div style="font-size:13px">擲出 ${r.roll.filter(Boolean).length} 次成功${r.need ? `，需要 ${r.need}` : ''}</div>` : ''}
      <div>${r.text}</div></div>`).join('') + `<div class="btns"><button id="btnOk">繼續</button></div>`);
    $('btnOk').onclick = hideModal;
  }

  function showShop() {
    if (S.over) return;
    showModal(`<h3>市集</h3><p style="font-size:14px">物品放進儀式的物品槽可增加骰子，用後消耗。你有 ${S.gold} 金幣。</p><div class="shop">` +
      ITEMS.map((it, i) => `<div><span><b>${it.name}</b>　${it.desc}</span><button data-buy="${i}" ${S.gold < it.price ? 'disabled' : ''}>${it.price} 金幣</button></div>`).join('') +
      `</div><div class="btns"><button class="ghost" id="btnClose" style="color:var(--ink);border-color:var(--ink)">離開</button></div>`);
    document.querySelectorAll('[data-buy]').forEach(b => (b.onclick = () => {
      const it = ITEMS[+b.dataset.buy];
      if (S.gold < it.price) return;
      S.gold -= it.price;
      S.items.push({ ...it, id: nextId++, kind: 'item' });
      log(`你在市集買下${it.name}。`);
      save();
      render();
      showShop();
    }));
    $('btnClose').onclick = hideModal;
  }

  function showHelp() {
    showModal(`<h3>玩法說明</h3><ul class="help">
      <li>每週蘇丹會賜下一張旨意：縱慾、奢靡、征服、殺戮，等級為石、銅、銀、金。七天內未完成就會被處決，撐過八週即倖存。</li>
      <li>把人物、金幣、物品卡拖進儀式的卡槽（或先點卡牌再點卡槽），湊齊必要的卡槽後按「開始儀式」。點已放入的卡槽可取回卡牌。</li>
      <li>儀式需要數天才會完成，期間卡牌被鎖住。每天結束時，完成的儀式會擲骰結算。</li>
      <li>判定：參與人物對應屬性的總和、特性加成、物品加成就是骰子數，每顆骰子一半機率成功。</li>
      <li>門客每天要付俸祿，付不出來就會離開。「忠誠」的人不收俸祿。</li>
      <li>城中事件會串成支線：維齊爾的陰謀、公主的出逃、地下反抗軍、星盤之謎。結局不只一種。</li>
    </ul><div class="btns"><button id="btnClose">開始</button></div>`);
    $('btnClose').onclick = () => { hideModal(); try { localStorage.setItem('sultan.seenHelp2', '1'); } catch (e) {} };
  }

  function save() { try { localStorage.setItem('sultan.save2', JSON.stringify({ S, nextId })); } catch (e) {} }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem('sultan.save2'));
      if (d && d.S && !d.S.over) {
        S = d.S;
        nextId = d.nextId;
        S.items.forEach(it => Object.assign(it, ITEMS.find(x => x.name === it.name) || {}));
        return true;
      }
    } catch (e) {}
    return false;
  }

  $('btnEnd').onclick = endDay;
  $('lnkHelp').onclick = e => { e.preventDefault(); showHelp(); };
  $('lnkShop').onclick = e => { e.preventDefault(); showShop(); };
  $('lnkRestart').onclick = e => { e.preventDefault(); if (confirm('確定要重新開始嗎？')) newGame(); };

  if (load()) render();
  else newGame();
  let seenHelp = false;
  try { seenHelp = !!localStorage.getItem('sultan.seenHelp2'); } catch (e) {}
  if (!seenHelp) showHelp();
})();
</script>
</body>
</html>
